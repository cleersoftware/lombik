{% extends 'base/base.html' %}

{% block title %}Admin · Guide{% endblock %}

{% block content %}
<section class="w-full">
    <div class="flex items-start justify-between">
        <div>
            <h2 class="font-light text-ink text-2xl">Admin</h2>
            <p class="mt-2 text-sm text-ink-muted">How to build with Lombik.</p>
        </div>
    </div>

    {% include 'admin/partials/nav.html' %}
</section>

<section class="rounded-xl border border-line bg-surface p-6 sm:p-8">
    <article id="guide-content" class="markdown"></article>
</section>

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script>
    var raw = {{ guide_html | tojson }};
    document.getElementById('guide-content').innerHTML = marked.parse(raw);
</script>
{% endblock %}
