{% extends 'base/base.html' %}

{% block title %}Admin{% endblock %}

{% block extend_header %}
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
{% endblock %}

{% block content %}
<section class="w-full space-y-8 pb-24">
    <header class="flex items-start justify-between gap-6">
        <div>
            <h2 class="text-3xl font-light text-ink tracking-tight">Admin</h2>
            <p class="mt-2 text-sm text-ink-muted">Owner-only overview, error log, schema and themes.</p>
        </div>

        <span
            class="inline-flex items-center gap-1.5 text-[11px] font-mono text-ink-muted whitespace-nowrap"
            title="App started {{ app_started_at | localtime }}"
        >
            <span class="w-1.5 h-1.5 rounded-full bg-success animate-pulse"></span>
            live · up {{ app_started_at | timesince }}
        </span>
    </header>

    <nav
        id="admin-nav"
        class="relative flex items-center gap-1 p-1 rounded-xl border border-line bg-surface overflow-x-auto no-scrollbar"
    >
        <div id="admin-nav-highlight" class="admin-nav-highlight"></div>

        <button type="button" data-admin-nav data-page="errors"
            hx-get="{{ url_for('admin_bp.page_errors') }}"
            hx-target="#admin-main" hx-swap="innerHTML"
            hx-push-url="{{ url_for('admin_bp.index') }}"
            onclick="setActiveNav(this)"
            class="relative z-10 whitespace-nowrap px-4 py-2 text-sm rounded-lg text-ink-muted transition-colors">
            <ion-icon name="bug-outline" class="mr-1.5"></ion-icon>Errors
        </button>

        <button type="button" data-admin-nav data-page="schema"
            hx-get="{{ url_for('admin_bp.page_schema') }}"
            hx-target="#admin-main" hx-swap="innerHTML"
            hx-push-url="{{ url_for('admin_bp.schema_page') }}"
            onclick="setActiveNav(this)"
            class="relative z-10 whitespace-nowrap px-4 py-2 text-sm rounded-lg text-ink-muted transition-colors">
            <ion-icon name="layers-outline" class="mr-1.5"></ion-icon>Schema
        </button>

        <button type="button" data-admin-nav data-page="appearance"
            hx-get="{{ url_for('admin_bp.page_appearance') }}"
            hx-target="#admin-main" hx-swap="innerHTML"
            hx-push-url="{{ url_for('admin_bp.appearance_page') }}"
            onclick="setActiveNav(this)"
            class="relative z-10 whitespace-nowrap px-4 py-2 text-sm rounded-lg text-ink-muted transition-colors">
            <ion-icon name="color-palette-outline" class="mr-1.5"></ion-icon>Appearance
        </button>

        <button type="button" data-admin-nav data-page="guide"
            hx-get="{{ url_for('admin_bp.page_guide') }}"
            hx-target="#admin-main" hx-swap="innerHTML"
            hx-push-url="{{ url_for('admin_bp.guide_page') }}"
            onclick="setActiveNav(this)"
            class="relative z-10 whitespace-nowrap px-4 py-2 text-sm rounded-lg text-ink-muted transition-colors">
            <ion-icon name="book-outline" class="mr-1.5"></ion-icon>Guide
        </button>
    </nav>

    <div id="admin-main" hx-get="{{ initial_url }}" hx-trigger="load" hx-swap="innerHTML">
        <div class="rounded-xl border border-line bg-surface p-10 text-sm text-ink-muted animate-pulse">Loading…</div>
    </div>
</section>

<!-- Terminal -->
<div class="fixed bottom-0 left-0 right-0 z-40 px-3 pb-3">
    <div class="max-w-3xl mx-auto rounded-xl border border-line bg-surface shadow-2xl overflow-hidden">
        <div class="flex items-center justify-between px-4 py-2 border-b border-line">
            <span class="inline-flex items-center gap-2 text-xs font-mono text-ink-muted">
                <span class="w-1.5 h-1.5 rounded-full bg-success"></span> terminal
            </span>
            <button type="button" onclick="toggleTerminal()" class="text-xs text-ink-muted hover:text-ink transition-colors">
                <ion-icon id="terminal-chevron" name="chevron-down-outline"></ion-icon>
            </button>
        </div>

        <div id="terminal-body" class="p-3 space-y-3 max-h-72 overflow-y-auto">
            <form
                hx-post="{{ url_for('admin_bp.terminal') }}"
                hx-target="#terminal-log"
                hx-swap="beforeend"
                hx-on::after-request="this.reset()"
                class="flex items-center gap-2"
            >
                <span class="text-success font-mono text-sm">$</span>
                <input
                    id="terminal-input"
                    name="command"
                    autocomplete="off"
                    placeholder="lombik model animal"
                    class="flex-1 bg-transparent outline-none text-sm font-mono text-ink placeholder:text-ink-muted/50"
                />
                <button type="submit" class="px-3 py-1.5 rounded-lg bg-ink text-canvas text-xs font-medium hover:opacity-90 transition">
                    Run
                </button>
            </form>

            <div id="terminal-log" class="space-y-4"></div>
        </div>
    </div>
</div>

<script>
    function setActiveNav(btn) {
        var nav = document.getElementById('admin-nav');
        var highlight = document.getElementById('admin-nav-highlight');
        if (!nav || !highlight || !btn) return;

        document.querySelectorAll('[data-admin-nav]').forEach(function (b) {
            b.classList.remove('text-ink', 'font-medium');
            b.classList.add('text-ink-muted');
        });
        btn.classList.add('text-ink', 'font-medium');
        btn.classList.remove('text-ink-muted');

        var navRect = nav.getBoundingClientRect();
        var btnRect = btn.getBoundingClientRect();
        highlight.style.width = btnRect.width + 'px';
        highlight.style.transform = 'translateX(' + (btnRect.left - navRect.left) + 'px)';
    }

    function pageFromPath(path) {
        var seg = path.split('/').filter(Boolean).pop();
        if (!seg || seg === 'admin') return 'errors';
        return seg;
    }

    function toggleTerminal() {
        var body = document.getElementById('terminal-body');
        var chevron = document.getElementById('terminal-chevron');
        if (!body || !chevron) return;
        body.classList.toggle('hidden');
        chevron.setAttribute('name', body.classList.contains('hidden') ? 'chevron-up-outline' : 'chevron-down-outline');
    }

    function copyText(text, btn) {
        function done() {
            var original = btn.innerHTML;
            btn.innerHTML = '<ion-icon name="checkmark-outline"></ion-icon>';
            setTimeout(function () { btn.innerHTML = original; }, 1200);
        }
        if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(text).then(done);
        } else {
            var ta = document.createElement('textarea');
            ta.value = text;
            document.body.appendChild(ta);
            ta.select();
            document.execCommand('copy');
            document.body.removeChild(ta);
            done();
        }
    }

    function initTerminalHistory() {
        var input = document.getElementById('terminal-input');
        if (!input) return;

        var history = [];
        var historyIndex = -1;
        var draft = '';

        try {
            history = JSON.parse(localStorage.getItem('lombik_terminal_history') || '[]');
            if (!Array.isArray(history)) history = [];
        } catch (e) { history = []; }

        function save() {
            try { localStorage.setItem('lombik_terminal_history', JSON.stringify(history)); } catch (e) {}
        }

        input.addEventListener('keydown', function (e) {
            if (e.key === 'ArrowUp') {
                e.preventDefault();
                if (history.length === 0) return;
                if (historyIndex === -1) draft = input.value;
                if (historyIndex < history.length - 1) historyIndex++;
                input.value = history[history.length - 1 - historyIndex];
            } else if (e.key === 'ArrowDown') {
                e.preventDefault();
                if (historyIndex <= 0) {
                    historyIndex = -1;
                    input.value = draft;
                    draft = '';
                } else {
                    historyIndex--;
                    input.value = history[history.length - 1 - historyIndex];
                }
            }
        });

        var form = input.closest('form');
        if (form) {
            form.addEventListener('submit', function () {
                var cmd = input.value.trim();
                if (!cmd) return;
                if (history[history.length - 1] !== cmd) {
                    history.push(cmd);
                    if (history.length > 50) history = history.slice(-50);
                    save();
                }
                historyIndex = -1;
                draft = '';
            });
        }
    }

    document.addEventListener('DOMContentLoaded', function () {
        var btn = document.querySelector('[data-page="' + pageFromPath(location.pathname) + '"]');
        if (btn) setActiveNav(btn);
        initTerminalHistory();
    });

    window.addEventListener('popstate', function () {
        var btn = document.querySelector('[data-page="' + pageFromPath(location.pathname) + '"]');
        if (btn) setActiveNav(btn);
    });
</script>
{% endblock %}
