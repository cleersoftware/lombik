<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset your password</title>
</head>

<body style="margin: 0; padding: 0; font-family: Arial, sans-serif; background: #f8f6f2; color: #292524;">
    <div style="max-width: 600px; margin: 40px auto; padding: 32px; background: #fcfbf9; border-radius: 16px;">

    <h1 style="font-size: 22px; margin-bottom: 16px;">
        Reset your password
    </h1>

    <p style="font-size: 14px; line-height: 1.6;">
        We received a request to reset your password.
    </p>

    <p style="font-size: 14px; line-height: 1.6;">
        Click the button below to choose a new password.
        This link will expire in 30 minutes.
    </p>

    <div style="margin: 28px 0;">
        <a
            href="{{ url }}"
            style="display: inline-block; padding: 12px 20px; background: #ff6b5a; color: #ffffff; text-decoration: none; border-radius: 10px; font-size: 14px;"
        >
            Reset password
        </a>
    </div>

    <p style="font-size: 12px; line-height: 1.5; color: #78716c;">
        If you did not request a password reset, you can safely ignore this email.
    </p>

</div>

</body>
</html>
