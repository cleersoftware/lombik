{% extends 'base/base.html' %}
{% block title %}
Log in
{% endblock %}
{% block content %}
<section class="flex w-full h-full items-center justify-center">
    <form class="max-w-lg flex flex-col items-center justify-evenly gap-3">
        <h1 class="text-lg font-semibold">Log in</h1>
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        {% for field in LoginForm.fields %}
            <div>
                <label for="{{ field.name }}" class="block text-sm font-medium text-slate-700 mb-1">{{ field.label }}</label>
                <input 
                type="{{ field.type }}"
                name="{{ field.name }}"
                minlength="{{ field.minlength }}" 
                maxlength="{{ field.maxlength }}"
                value="{{ field.value }}"
                {% if field.required %}required{% endif %}
                class="w-full px-4 py-2 rounded-xl border border-stone-300 text-xs">
                {% if field.error %}
                    <p class="text-xs text-red-500">{{ field.error }}</p>   
                {% endif %}
            </div>
        {% endfor %}
        <button
            hx-post="{{ url_for('auth_bp.authenticate') }}"
            hx-swap="none"
            class="w-full bg-primary rounded-xl text-white text-xs px-4 py-2"
        >
            Log in
        </button>
        <a
            href="{{ url_for('core_bp.home') }}"
            class="w-full flex items-center justify-center border border-zinc-700 rounded-xl text-xs px-4 py-2">
            Home
        </a>
    </form>
</section>
{% endblock %}
