{% extends "base/auth_base.html" %}

{% block title %}
Login
{% endblock %}

{% block content %}

<section class="min-h-screen w-full flex items-center justify-center px-6">

    <div class="w-full max-w-md bg-white/90 backdrop-blur rounded-3xl shadow-2xl border border-white/40 p-8">

        <div class="flex flex-col items-center text-center gap-4 mb-8">

            <picture class="w-20 h-20">
                <img 
                    src="{{ url_for('static', filename='icons/lombik_logo_512.png') }}"
                    alt="Lombik Logo"
                    class="w-full h-full object-contain drop-shadow-sm"
                >
            </picture>

            <div class="space-y-1">
                <h1 class="text-3xl font-bold tracking-tight text-slate-800">
                    Welcome
                </h1>

                <p class="text-sm text-slate-500">
                    Sign in to continue to your workspace.
                </p>
            </div>

        </div>

        <form action="#" method="post" class="space-y-5">

            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <div class="space-y-2">
                <label class="text-sm font-medium text-slate-700">
                    Email
                </label>

                <input 
                    type="email" 
                    name="email" 
                    required
                    placeholder="you@example.com"
                    class="w-full px-4 py-3 rounded-2xl border border-slate-300 bg-white
                           focus:outline-none focus:ring-4 focus:ring-primary/10
                           focus:border-primary transition shadow-sm"
                />
            </div>

            <div class="space-y-2">
                <div class="flex items-center justify-between">
                    <label class="text-sm font-medium text-slate-700">
                        Password
                    </label>

                </div>

                <input 
                    type="password" 
                    name="password" 
                    required
                    placeholder="••••••••"
                    class="w-full px-4 py-3 rounded-2xl border border-slate-300 bg-white
                           focus:outline-none focus:ring-4 focus:ring-primary/10
                           focus:border-primary transition shadow-sm"
                />
            </div>

            <button 
                type="submit"
                class="w-full py-3.5 rounded-2xl bg-primary text-white font-semibold
                       shadow-lg hover:shadow-xl hover:brightness-110
                       transition active:scale-[0.985]"
            >
                Log in
            </button>

        </form>

    </div>

</section>

{% endblock %}
