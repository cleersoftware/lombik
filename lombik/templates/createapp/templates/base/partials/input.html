<div>
    <label for="{{ field.name }}" class="block text-sm font-medium text-slate-700 mb-1">{{ field.label }}</label>
    <input 
    type="{{ field.type }}"
    name="{{ field.name }}"
    minlength="{{ field.minlength }}" 
    maxlength="{{ field.maxlength }}"
    value="{{ field.value }}"
    {% if field.required %}required{% endif %}
    class="w-full px-4 py-2 rounded-xl border border-stone-300 text-xs">
    {% if field.error %}
        <p class="text-xs text-red-500">{{ field.error }}</p>   
    {% endif %}
</div>
