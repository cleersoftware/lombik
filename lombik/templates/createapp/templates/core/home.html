{% extends "base/base.html" %}

{% block title %}
Home
{% endblock %}

{% block content %}

<main class="relative w-full min-h-screen overflow-scroll scroll-smooth">

    <div class="absolute inset-0 -z-10 overflow-hidden">
        <div class="absolute top-[-10rem] left-1/2 -translate-x-1/2 w-[40rem] h-[40rem] bg-primary/5 blur-3xl rounded-full"></div>
    </div>

    <section class="max-w-6xl mx-auto px-6 py-20 flex flex-col items-center text-center gap-10">
        <div class="space-y-6 max-w-3xl">
            <h1 class="text-3xl font-semibold">Welcome {{ user.username | proper }}!</h1>
            {% include 'auth/partials/lombik_version.html' %}
            <p class="text-xs uppercase tracking-[0.35em] text-zinc-600 dark:text-zinc-300">
                3, 2, 1... Developing!
            </p>
        </div>
    </section>

</main>

{% endblock %}
