{% extends 'base/base.html' %}

{% block title %}Session expired{% endblock %}

{% block content %}
<section class="w-full flex flex-col items-center justify-center py-20 text-center">
    <h1 class="text-5xl font-bold text-brand">Session expired</h1>
    <p class="mt-4 max-w-sm text-sm text-ink-muted">
        Your session timed out for security. Refresh the page and try again.
    </p>
    <a href="{{ request.referrer or url_for('core_bp.home') }}"
       class="mt-8 px-5 py-2.5 rounded-lg bg-ink text-canvas text-sm font-medium hover:opacity-90 transition">
        Refresh session
    </a>
</section>
{% endblock %}
