{% extends "studio/base.html" %}

{% block studio_title %}Not found{% endblock %}

{% block studio_content %}
<div class="max-w-2xl mx-auto px-6 py-24 text-center">
    <ion-icon name="help-circle-outline" class="text-6xl text-zinc-300 dark:text-zinc-600"></ion-icon>
    <h1 class="mt-6 text-3xl font-bold text-zinc-800 dark:text-zinc-100">Model not found</h1>
    <p class="mt-2 text-zinc-500 dark:text-zinc-400">
        We couldn't find a model named <span class="font-mono text-primary">{{ name }}</span>.
    </p>
    <a href="{{ url_for('studio_bp.models') }}"
       class="inline-flex items-center gap-2 mt-8 px-5 py-2.5 rounded-xl bg-primary text-white text-sm font-medium hover:opacity-90 transition">
        <ion-icon name="arrow-back-outline"></ion-icon> Back to models
    </a>
</div>
{% endblock %}
