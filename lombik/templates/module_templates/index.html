{% extends 'base/base.html' %}

{% block title %}
{{ module_name }}
{% endblock %}

{% block content %}
<section class="w-full">
    <h2 class="font-light text-ink text-2xl">{{ module_name }}</h2>
    <p class="mt-2 text-sm text-ink-muted">
        A freshly generated module. Add pages and services inside
        <span class="font-mono text-ink">blueprints/{{ module_name }}/</span>.
    </p>
</section>

<section class="rounded-xl border border-line bg-surface p-6">
    <p class="text-sm text-ink-muted">
        This module is registered automatically — visit
        <a href="{{ url_for('{{ module_name }}_bp.home') }}" class="font-mono text-brand hover:underline">
            /{{ module_name }}
        </a>.
    </p>
</section>
{% endblock %}
