<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#FFFFFF">
    <meta name="description" content="cleersoftware.com"/>
    <meta name="keywords" content="starterapp/>
    <meta name="author" content="David Plajner - cleer." />
    <script>
        const savedTheme = localStorage.getItem("theme");
      
        if (
          savedTheme === "dark" ||
          (!savedTheme && window.matchMedia("(prefers-color-scheme: dark)").matches)
        ) {
          document.documentElement.classList.add("dark");
        }
      </script>

    <title>{% block title %}{% endblock %} · lombik by cleer.</title>

    <link rel="manifest" href="/manifest.json">
    <link rel="icon" href="{{ url_for('static', filename='icons/favicon_dot.ico') }}" type="image/x-icon">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/global.css') }}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/easymde/dist/easymde.min.css">
  
    
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Literata:wght@200;300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@100;200;300;400;500;600;700;800&display=swap" rel="stylesheet">


    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/easymde/dist/easymde.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.8/dist/htmx.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              primary: "#FF6B5A"
            }
          }
        }
      }
    </script>
    {% block extend_header %}
    {% endblock %}

</head>
    <body class="h-screen w-full flex bg-white dark:bg-zinc-950 dark:text-gray-100 overflow-hidden">
            {% block content %}
            {% endblock %}
        </main>
    </body>
    
    <script src="{{ url_for('static', filename='js/theme.js') }}" defer></script>
    <script src="{{ url_for('static', filename='js/flash.js') }}" defer></script>
    <script src="{{ url_for('static', filename='js/modal.js') }}" defer></script>
    
    {% with messages = get_flashed_messages(with_categories=true) %}
    {% include 'partials/flash.html' %}
    {% endwith %}
</html>
