[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "lombik"
version = "4.4.0"
description = "Flask scaffold engine"
authors = [
    { name="David Plajner" }
]
readme = "README.md"

dependencies = [
    "Flask",
    "Flask-SQLAlchemy",
    "Flask-Migrate",
    "Flask-WTF",
    "Flask-Session",
    "Flask-Caching",
    "Flask-Limiter",
    "python-dotenv",
    "click",
    "SQLAlchemy",
    "Werkzeug",
    "psycopg2-binary",
    "pytest",
    "pytest-cov",
    "resend",
    "python-dateutil",
    "gunicorn"
]

[project.scripts]
lombik = "lombik.cli:cli"

[tool.setuptools.package-data]
lombik = [
    "templates/**/*",
]